name: AaharaLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov flake8

    - name: Lint with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all other warnings as non-fatal
        flake8 src/ --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics

    - name: Run Test Suite with Coverage
      env:
        ENVIRONMENT: testing
        SECRET_KEY: test-secret-key-nutrition-platform-2026-minimum-32-chars
        ADMIN_API_KEY: test-admin-api-key-2026
        ALLOW_FALLBACK_IN_PROD: false
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80
